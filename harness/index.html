<!doctype html>
<!--
  Loads the real built main.js against a stubbed Obsidian API and mounts the real
  sidebar view, inside Obsidian's own app.css and the vault's theme. So a crash in
  onOpen shows up here with a stack, and the layout is the layout the plugin builds
  rather than a copy of it.

    npm run build && node harness/prepare.mjs
    python3 -m http.server 8901        # from the plugin root, not from harness/
    open http://127.0.0.1:8901/harness/index.html

  harness/turns.html is the same CSS with hand-written markup for a conversation
  that already has answers in it.
-->
<html>
	<head>
		<meta charset="utf-8" />
		<link rel="stylesheet" href="assets/app.css" />
		<link rel="stylesheet" href="assets/theme.css" />
		<link rel="stylesheet" href="../styles.css" />
		<style>
			body { margin: 0; height: 100vh; overflow: hidden; }
			.harness-split { height: 100vh; margin-left: auto; }
			#harness-error {
				position: fixed;
				inset: 0 auto auto 0;
				max-width: 60vw;
				margin: 16px;
				padding: 12px 16px;
				background: #2b0b0b;
				color: #ffb4b4;
				font: 12px/1.5 ui-monospace, monospace;
				white-space: pre-wrap;
				z-index: 99;
			}
			#harness-error:empty { display: none; }
		</style>
	</head>
	<body class="theme-light mod-macos is-frameless">
		<pre id="harness-error"></pre>
		<div class="app-container">
			<div class="horizontal-main-container">
				<div class="workspace">
					<div class="workspace-split mod-horizontal mod-right-split harness-split" style="width: 380px">
						<div class="workspace-tabs mod-top mod-top-right-space">
							<div class="workspace-tab-container">
								<div class="workspace-leaf" id="harness-leaf"></div>
							</div>
						</div>
					</div>
				</div>
			</div>
		</div>
		<div class="status-bar">
			<div class="status-bar-item"><span class="status-bar-item-segment">0 backlinks</span></div>
			<div class="status-bar-item"><span class="status-bar-item-segment">6 words 38 characters</span></div>
		</div>
		<script type="module">
			import * as obsidian from "./obsidian-stub.js";
			import { createApp } from "./app-stub.js";

			const errorEl = document.getElementById("harness-error");
			const fail = (what, error) => {
				errorEl.textContent += `${what}\n${error?.stack ?? error}\n\n`;
				document.title = `FAILED: ${what} — ${error?.message ?? error}`;
			};
			window.addEventListener("error", (e) => fail("uncaught", e.error ?? e.message));
			window.addEventListener("unhandledrejection", (e) => fail("unhandled rejection", e.reason));

			obsidian.installDomExtensions(window);
			// runner.ts builds a PATH from the environment before it spawns anything.
			window.process = { env: { PATH: "/usr/bin:/bin" }, platform: "darwin" };

			/**
			 * Claude Code's stream-json, from a script rather than a process: the init
			 * line, a turn, the answer arriving in pieces, then the result with usage. So
			 * the parser, the streaming render, the trailing blocks and the note write all
			 * run here exactly as they do against the real binary.
			 */
			function fakeAgent(binary, args) {
				const resumed = args.includes("--resume");
				const question = args[args.length - 1];
				// Every run, so the page can read what the CLI was actually asked — whether a
				// resumed turn sends only the question, and what a turn that cannot resume sends.
				(window.spawned ??= []).push({ binary, args, resumed, prompt: question });
				const answer = [
					resumed
						? "Above the cutoff every candidate is returned unranked."
						: `The cutoff is the per-mode similarity floor, and it is only consulted above 100k rows.`,
					"",
					"## Sources",
					"",
					`- [[${window.notes[0].split("/").pop().replace(/\.md$/, "")}#Some content]]`,
					"",
					"```follow-ups",
					"Why is it per mode?",
					"What happens above it?",
					"```",
					...(resumed ? [] : ["", "```title", "Similarity floor and row counts", "```"]),
				].join("\n");

				const listeners = new Map();
				const stream = () => ({
					setEncoding() {},
					on(event, fn) {
						listeners.set(`out:${event}`, fn);
					},
				});
				const child = {
					stdout: stream(),
					stderr: { setEncoding() {}, on() {} },
					on(event, fn) {
						listeners.set(event, fn);
					},
					kill() {
						listeners.get("close")?.(null);
					},
				};
				setTimeout(() => {
					const send = (line) => listeners.get("out:data")?.(`${JSON.stringify(line)}\n`);
					send({ type: "system", subtype: "init", model: "claude-opus-5", session_id: "harness-session" });
					send({ type: "stream_event", event: { type: "message_start" } });
					for (const chunk of answer.match(/[\s\S]{1,40}/g) ?? []) {
						send({
							type: "stream_event",
							event: { type: "content_block_delta", delta: { type: "text_delta", text: chunk } },
						});
					}
					send({
						type: "result",
						is_error: false,
						session_id: "harness-session",
						duration_ms: 3700,
						usage: { input_tokens: 120, cache_read_input_tokens: 10700, output_tokens: 173 },
						result: answer,
					});
					listeners.get("close")?.(0);
					console.info(`[agent] ${binary} ${resumed ? "resumed" : "fresh"}: ${question.slice(0, 60)}`);
				}, 20);
				return child;
			}
			const vault = await (await fetch("assets/vault.json")).json();
			document.body.style.setProperty("--font-text-size", `${vault.fontSize}px`);

			// The built bundle is CJS and externalises the node builtins Obsidian provides.
			// spawn is the one that matters: a question has to be answerable here, or
			// nothing downstream of it — the note it writes, the list it grows — is testable.
			const modules = {
				obsidian,
				child_process: { spawn: fakeAgent },
				os: { homedir: () => "/harness" },
				path: {},
				fs: {},
				electron: {},
			};
			const source = await (await fetch("../main.js")).text();
			const module = { exports: {} };
			new Function("require", "module", "exports", source)(
				(name) => {
					const found = modules[name];
					if (!found) throw new Error(`harness has no stub for "${name}"`);
					return found;
				},
				module,
				module.exports,
			);
			const AskAiPlugin = module.exports.default;

			// The real paths and settings from the vault, so the sidebar mounts against
			// note names that exist and whatever is actually configured.
			const data = await (await fetch("assets/data.json")).json().catch(() => ({}));
			const notePaths = Object.keys(data.sessions ?? {});
			if (notePaths.length < 2) notePaths.push("Ideas/A note.md", "Ideas/Another note.md");
			const notes = {};
			for (const path of notePaths) notes[path] = `# ${path.split("/").pop().replace(/\.md$/, "")}\n\nSome content.\n`;

			// One conversation already on disk, as a plugin that has been used would leave
			// it: this is what the list renders from and what restore() reads back.
			const seeded = `askai-conversations/${notePaths[0].split("/").pop().replace(/\.md$/, "")}/Vector index cutoff.md`;
			notes[seeded] = [
				"---",
				"type: ask-ai-conversation",
				`source: "[[${notePaths[0].split("/").pop().replace(/\.md$/, "")}]]"`,
				"agent: claude",
				"session: seeded-1",
				"created: 2026-09-06T20:11",
				"updated: 2026-09-06T20:14",
				"follow_ups:",
				'  - "Why is it per mode?"',
				'  - "What happens above it?"',
				"---",
				"",
				"## What does CUTOFF do?",
				"",
				"It is the per-mode similarity floor.",
				"",
				"### Sources",
				"",
				`- [[${notePaths[0].split("/").pop().replace(/\.md$/, "")}]]`,
				"",
				"*Answered by claude-opus-5 · 3.7s · 10.8k in · 173 out*",
				"",
			].join("\n");

			// Conversations kept in the vault, which is the default for a new install; the
			// copied data.json is from before that setting existed and has it off.
			data.keepInVault = true;
			delete data.autoSave;
			// This harness mounts the sidebar, so drive the sidebar rather than whatever
			// the copied settings happen to say.
			data.surface = "sidebar";
			// And one conversation still in the settings file, in the old shape, so the
			// one-time move of those into the vault is exercised rather than assumed.
			data.sessions = {
				...(data.sessions ?? {}),
				[notePaths[1]]: {
					provider: "claude",
					id: "legacy-1",
					turns: [
						{
							question: "Which embedding model does this use?",
							answer: "It uses the CLIP image encoder.",
							footer: "claude-opus-5 · 2.1s",
							suggestions: ["What are the vector dimensions?"],
						},
					],
				},
			};

			const { app, leaf, open, dump, opened } = createApp({
				data,
				notes,
				activePath: notePaths[0],
				leafContainer: document.getElementById("harness-leaf"),
			});

			// The stub's modal is detached, and a textarea outside the document cannot hold
			// the caret — which is what decides where the caret goes back to when an answer
			// lands. So the question modal goes into the page, as it does in Obsidian.
			obsidian.Modal.prototype.open = function () {
				document.body.appendChild(this.modalEl);
				this.onOpen?.();
			};
			obsidian.Modal.prototype.close = function () {
				this.onClose?.();
				this.modalEl.remove();
			};

			const plugin = new AskAiPlugin(app, { id: "ask-ai", name: "Ask AI" });
			await plugin.onload();

			const factory = plugin.views.get("ask-ai-view");
			if (!factory) throw new Error("the plugin never registered ask-ai-view");
			const view = factory(leaf);
			view.containerEl.setAttr("data-type", "ask-ai-view");
			// Through open(), not onOpen(), so the load() step Obsidian runs first is run
			// here too — that is where a field name colliding with the base class bites.
			await view.open();
			if (!view.contentEl.childElementCount) throw new Error("the view opened but rendered nothing");

			// Only the open note's host is on screen, and only its open conversation: the
			// rest are hidden by a parent, so a selector has to start from the parent.
			const VISIBLE_NOTE = ".ask-ai-note-host:not(.ask-ai-hidden)";
			const VISIBLE = `${VISIBLE_NOTE} .ask-ai-host:not(.ask-ai-hidden)`;

			// Switching notes, asking a question, and starting a second conversation are
			// the whole point of the per-note lists, so the harness can drive all three.
			// So the plugin's own "reveal the sidebar" finds this leaf instead of asking
			// the workspace for a right split the stub does not have.
			leaf.view = view;
			app.workspace.getLeavesOfType = (type) => (type === "ask-ai-view" ? [leaf] : []);

			window.openNote = open;
			window.visible = VISIBLE;
			window.notes = notePaths;
			window.dump = dump;
			window.opened = opened;
			window.clickLink = (index = 0) => {
				const link = document.querySelectorAll(`${VISIBLE} a.internal-link`)[index];
				link?.dispatchEvent(new MouseEvent("click", { bubbles: true, cancelable: true }));
				return link?.getAttribute("href") ?? null;
			};
			window.ask = async (question) => {
				const input = view.contentEl.querySelector(VISIBLE + " .ask-ai-question-input");
				// Focused, because a question typed into the box is asked with the caret in
				// it, and that is what the box uses to decide whether to take it back.
				input.focus();
				input.value = question;
				view.contentEl
					.querySelector(VISIBLE + " .ask-ai-send")
					.dispatchEvent(new MouseEvent("click"));
				// Two frames: the run resolves in microtasks, the note is written after it.
				await new Promise((resolve) => setTimeout(resolve, 60));
				return window.conversations();
			};
			/**
			 * The right-click path: "Ask AI about the selection" and the follow-up item
			 * next to it, through the real question modal, so what it does to the list of
			 * conversations and to the caret is what the menu does.
			 */
			window.askAbout = async (question, { selection = null, fresh = true } = {}) => {
				await plugin.startAsk(app.workspace.getActiveFile(), selection, { fresh });
				const input = document.querySelector(".modal-content .ask-ai-question-input");
				if (!input) throw new Error("the question modal did not open");
				input.focus();
				input.value = question;
				input.dispatchEvent(new Event("input"));
				input.dispatchEvent(new KeyboardEvent("keydown", { key: "Enter", bubbles: true }));
				await new Promise((resolve) => setTimeout(resolve, 120));
				return window.conversations();
			};
			/** Where the caret is, which is the whole question about a pane stealing it. */
			window.focused = () => {
				const active = document.activeElement;
				if (!active) return "none";
				if (active === document.body) return "body";
				return active.className || active.tagName.toLowerCase();
			};

			window.newConversation = () =>
				view.contentEl.querySelector(".ask-ai-view-header button").dispatchEvent(new MouseEvent("click"));
			window.conversations = () =>
				[...view.contentEl.querySelectorAll(`${VISIBLE_NOTE} .ask-ai-list:not(.ask-ai-hidden) .ask-ai-list-row`)].map((row) => ({
					title: row.querySelector(".ask-ai-list-title").textContent,
					meta: row.querySelector(".ask-ai-list-meta").textContent,
					active: row.classList.contains("is-active"),
				}));

			const content = view.contentEl;
			// Looked up per call, not once: the first conversation mounts asynchronously
			// now, because it is read from a file.
			window.measure = () => {
				const row = content.querySelector(VISIBLE + " .ask-ai-input-row");
				return {
					theme: vault.theme,
					rendered: content.childElementCount,
					header: content.querySelector(".ask-ai-view-title")?.textContent,
					noteFontSize: getComputedStyle(document.body).getPropertyValue("--font-text-size").trim(),
					sidebarFontSize: getComputedStyle(content).fontSize,
					viewPadding: getComputedStyle(content).padding,
					gapUnderFooter: row
						? Math.round(content.getBoundingClientRect().bottom - row.getBoundingClientRect().bottom)
						: null,
					statusBarHeight: document.querySelector(".status-bar").offsetHeight,
					inputWidth: row ? Math.round(row.querySelector("textarea").getBoundingClientRect().width) : null,
					conversations: window.conversations().length,
				};
			};
			// After the first conversation has been read off disk and mounted.
			setTimeout(() => {
				if (!errorEl.textContent) document.title = JSON.stringify(window.measure());
			}, 50);
		</script>
	</body>
</html>
